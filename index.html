<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมตอบคำถามวิทยาศาสตร์: ระบบสุริยะ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>🚀 สำรวจระบบสุริยะ</h1>
            <div class="author-tag">ผู้พัฒนา: ณรงค์ฤทธิ์ สีหาญ</div>
        </header>

        <!-- หน้าเล่นเกม -->
        <main id="game-screen">
            <div class="quiz-card">
                <div class="question-number" id="question-number">กำลังโหลดคำถาม...</div>
                <div class="question-text" id="question-text"></div>
                <div class="options-grid" id="options-container"></div>
            </div>
            <div class="score-board">คะแนนสะสม: <span id="score">0</span></div>
        </main>

        <!-- หน้าสรุปผล -->
        <div id="result-screen" class="result-screen">
            <h2>🎉 ภารกิจเสร็จสิ้น!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 10px;">คุณทำคะแนนได้:</p>
            <p style="font-size: 2.5rem; color: #ffb703; font-weight: bold;" id="final-score">0 / 0</p>
            <p id="feedback-text" style="margin-top: 15px; color: #a8b2d1;"></p>
            <button class="btn-restart" onclick="restartGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        let quizData = [];
        let currentQuestion = 0;
        let score = 0;

        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const scoreEl = document.getElementById('score');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const finalScoreEl = document.getElementById('final-score');
        const feedbackTextEl = document.getElementById('feedback-text');

        // โหลดข้อมูลจากไฟล์ XML
        async function loadXML() {
            try {
                const response = await fetch('questions.xml');
                const str = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(str, "text/xml");
                
                const items = xmlDoc.getElementsByTagName('item');
                quizData = [];

                for (let i = 0; i < items.length; i++) {
                    const question = items[i].getElementsByTagName('question')[0].textContent;
                    const optionNodes = items[i].getElementsByTagName('option');
                    const options = Array.from(optionNodes).map(opt => opt.textContent);
                    const answer = parseInt(items[i].getElementsByTagName('answer')[0].textContent);

                    quizData.push({ question, options, answer });
                }

                loadQuiz();
            } catch (error) {
                questionNumberEl.textContent = "ไม่สามารถโหลดข้อมูลคำถามได้";
                console.error('Error loading XML:', error);
            }
        }

        function loadQuiz() {
            if (quizData.length === 0) return;

            const currentData = quizData[currentQuestion];
            questionNumberEl.textContent = `คำถามที่ ${currentQuestion + 1} / ${quizData.length}`;
            questionTextEl.textContent = currentData.question;
            
            optionsContainer.innerHTML = '';
            currentData.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('btn-option');
                button.textContent = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(selectedIndex) {
            if (selectedIndex === quizData[currentQuestion].answer) {
                score++;
                scoreEl.textContent = score;
            }
            
            currentQuestion++;
            
            if (currentQuestion < quizData.length) {
                loadQuiz();
            } else {
                showResults();
            }
        }

        function showResults() {
            gameScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            finalScoreEl.textContent = `${score} / ${quizData.length}`;
            
            if (score === quizData.length) {
                feedbackTextEl.textContent = "สุดยอดมาก! คุณคือผู้เชี่ยวชาญด้านระบบสุริยะตัวจริง!";
            } else if (score >= Math.ceil(quizData.length / 2)) {
                feedbackTextEl.textContent = "เก่งมาก! คุณมีความรู้เรื่องระบบสุริยะดีเยี่ยม";
            } else {
                feedbackTextEl.textContent = "ลองศึกษาใหม่อีกนิด แล้วมาเล่นใหม่อีกรอบนะ!";
            }
        }

        function restartGame() {
            currentQuestion = 0;
            score = 0;
            scoreEl.textContent = score;
            resultScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            loadQuiz();
        }

        // เริ่มโหลดข้อมูลเมื่อเปิดหน้าเว็บ
        loadXML();
    </script>
</body>
</html>
